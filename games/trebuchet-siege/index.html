<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoolHistoryGames - Trebuchet Siege Simulator</title><style>body{background:#1a1a1a;color:#f0f0f0;font-family:monospace;text-align:center;margin:0;padding:20px}canvas{background:#87ceeb;display:block;margin:20px auto;border:4px solid #4a3b32;max-width:95%;box-shadow:0 10px 25px #0008}.controls{background:#2c2c2c;padding:15px;display:inline-block;border-radius:8px;border:1px solid #444}input{width:80px;padding:5px;background:#111;color:white;border:1px solid #666}button{padding:8px 16px;background:#8b4513;color:white;border:0;font-weight:bold;cursor:pointer;border-radius:4px}button:hover{background:#a0522d}</style></head><body><h1>TREBUCHET SIEGE: 1291 AD</h1><p>Adjust launch velocity and angle to breach the fortress wall.</p><div class="controls"><label>Angle (°): <input type="number" id="angle" value="45" min="10" max="80"></label> <label>Winch Tension (Power): <input type="number" id="velocity" value="30" min="10" max="60"></label> <button onclick="fireProjectile()">Fire Payload</button></div><canvas id="gameCanvas" width="800" height="400"></canvas><p id="status" aria-live="polite"></p><script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
let ball={x:100,y:320,vx:0,vy:0,active:false,radius:8};let target={x:650,y:280,w:40,h:100};let groundY=328;
function drawScene(){ctx.clearRect(0,0,800,400);ctx.fillStyle='#557a2b';ctx.fillRect(0,groundY,800,400-groundY);ctx.fillStyle='#3a531c';ctx.fillRect(0,groundY,800,6);ctx.fillStyle='#4a3b32';ctx.fillRect(80,groundY-40,30,40);ctx.beginPath();ctx.moveTo(95,groundY-40);ctx.lineTo(60,groundY);ctx.stroke();ctx.fillStyle='#7a7a7a';ctx.fillRect(target.x,target.y,target.w,target.h);ctx.fillStyle='#4a4a4a';for(let i=target.y;i<target.y+target.h;i+=15)ctx.fillRect(target.x,i,target.w,2);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.fill();}
function fireProjectile(){if(ball.active)return;const angleRad=Math.max(10,Math.min(80,Number(document.getElementById('angle').value)||45))*Math.PI/180;const v=Math.max(10,Math.min(60,Number(document.getElementById('velocity').value)||30));ball.x=100;ball.y=groundY-40;ball.vx=Math.cos(angleRad)*v*.4;ball.vy=-Math.sin(angleRad)*v*.4;ball.active=true;document.getElementById('status').textContent='Projectile in flight';}
function update(){if(ball.active){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.25;if(ball.x>=target.x&&ball.x<=target.x+target.w&&ball.y>=target.y&&ball.y<=target.y+target.h){ball.active=false;document.getElementById('status').textContent='Direct Hit! Fortress Wall Breached.';}else if(ball.y>=groundY||ball.x>810){ball.active=false;document.getElementById('status').textContent='Missed. Adjust your angle and power.';}}drawScene();requestAnimationFrame(update);}drawScene();requestAnimationFrame(update);
</script></body></html>
